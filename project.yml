name: FranceInter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  FranceInter:
    type: application
    platform: iOS
    sources:
      - FranceInter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.franceinterjournal
        INFOPLIST_FILE: FranceInter/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - FranceInterTests
  FranceInterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FranceInterTests
    dependencies:
      - target: FranceInter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.franceinterjournal.tests
        GENERATE_INFOPLIST_FILE: YES

